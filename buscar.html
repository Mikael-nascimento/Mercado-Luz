<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Encontre alimentos, limpeza, higiene, carnes, frutas, congelados e ofertas."><title>Buscar produtos | Mercado</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/shared.css"><link rel="stylesheet" href="css/components.css"><script src="js/catalogo.js" defer></script><script src="js/layout.js" defer></script><script src="js/app.js" defer></script></head><body><div id="site-header"></div><main class="container section"><span class="eyebrow">Encontre o que precisa</span><h1>Resultado da busca</h1><div id="search-results" class="product-grid search-results"></div></main><div id="site-footer"></div><script>document.addEventListener('DOMContentLoaded',()=>{const q=new URLSearchParams(location.search).get('q')||'';document.getElementById('search-input').value=q;const found=PRODUTOS.filter(p=>(p.name+' '+p.detail+' '+p.category).toLocaleLowerCase('pt-BR').includes(q.toLocaleLowerCase('pt-BR')));document.getElementById('search-results').innerHTML=found.length?found.map(Mercado.card).join(''):'<div class="empty">Nenhum produto encontrado para essa busca.</div>'});</script></body></html>
