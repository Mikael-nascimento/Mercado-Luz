<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Encontre alimentos, limpeza, higiene, carnes, frutas, congelados e ofertas."><title>Meu carrinho | Mercado</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/shared.css"><link rel="stylesheet" href="css/components.css"><script src="js/catalogo.js" defer></script><script src="js/layout.js" defer></script><script src="js/app.js" defer></script></head><body><div id="site-header"></div><main class="container section"><div class="section-heading"><div><span class="eyebrow">Sua sacola</span><h1>Meu carrinho</h1></div><a href="index.html" class="btn btn-outline">← Continuar comprando</a></div><div class="cart-layout"><section class="cart-items"><div id="cart-list"></div></section><aside class="summary"><h2>Resumo do pedido</h2><div class="summary-line"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div><div class="summary-line"><span>Entrega</span><strong>A combinar</strong></div><div class="summary-line summary-total"><span>Total</span><strong id="total">R$ 0,00</strong></div><button class="btn btn-primary" id="checkout">Finalizar pedido</button><p class="notice">A finalização é demonstrativa: conecte um meio de pagamento e uma opção de entrega para receber pedidos reais.</p></aside></div></main><div id="site-footer"></div><script>document.addEventListener('DOMContentLoaded',()=>{const list=document.getElementById('cart-list');function render(){const c=Mercado.read();const entries=Object.entries(c).filter(([id,q])=>q>0&&Mercado.find(id));if(!entries.length){list.innerHTML='<div class="empty"><div style="font-size:2rem">🛒</div><h2>Seu carrinho está vazio</h2><p>Adicione produtos para começar suas compras.</p><a class="btn btn-primary" href="index.html">Ver produtos</a></div>';}else{list.innerHTML=entries.map(([id,q])=>{const p=Mercado.find(id);return `<div class="cart-row"><img src="assets/images/${p.image}" alt="${p.name}"><div><h3>${p.name}</h3><span class="muted">${Mercado.money(p.price)} cada</span><div class="qty-control"><button data-qty="${id}" data-delta="-1" aria-label="Diminuir">−</button><strong>${q}</strong><button data-qty="${id}" data-delta="1" aria-label="Aumentar">+</button><button class="remove" data-remove="${id}">Remover</button></div></div><strong>${Mercado.money(p.price*q)}</strong></div>`}).join('')};const total=entries.reduce((s,[id,q])=>s+Mercado.find(id).price*q,0);document.getElementById('subtotal').textContent=Mercado.money(total);document.getElementById('total').textContent=Mercado.money(total)}list.addEventListener('click',e=>{const q=e.target.closest('[data-qty]');const r=e.target.closest('[data-remove]');const c=Mercado.read();if(q){const id=q.dataset.qty;c[id]=Math.max(0,(c[id]||0)+Number(q.dataset.delta));if(!c[id])delete c[id];Mercado.save(c);render()}if(r){delete c[r.dataset.remove];Mercado.save(c);render()}});document.getElementById('checkout').addEventListener('click',()=>{if(!Object.keys(Mercado.read()).length){alert('Seu carrinho está vazio.');return}alert('Pedido demonstrativo! Para receber pedidos reais, configure WhatsApp, entrega e pagamento.');});render()});</script></body></html>
